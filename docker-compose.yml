services:
  postgres:
    image: postgres:16-alpine
    container_name: shareloop-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shareloop_db}
      POSTGRES_USER: ${POSTGRES_USER:-shareloop_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shareloop_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shareloop_user} -d ${POSTGRES_DB:-shareloop_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    name: shareloop_postgres_data
