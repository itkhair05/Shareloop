# Render Blueprint for the ShareLoop backend.
#
# This file never contains secret values. Secrets are marked `sync: false` and
# must be entered in the Render dashboard; the two cryptographic secrets are
# generated by Render on first creation.
#
# Applying this blueprint creates a paid web service in the Singapore region.
# Review the plan below before syncing it.
services:
  - type: web
    name: shareloop-backend
    runtime: docker
    region: singapore
    plan: starter
    numInstances: 1
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /actuator/health
    # Deployments stay manual unless auto-deploy is explicitly enabled.
    autoDeploy: false
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JAVA_OPTS
        value: "-XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"

      # Database (set the pooled endpoint for the application).
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: DB_POOL_MAX_SIZE
        value: "5"
      - key: DB_POOL_MIN_IDLE
        value: "1"
      - key: DB_SSL_MODE
        value: require
      # To run Flyway through Neon's DIRECT endpoint, add SPRING_FLYWAY_URL,
      # SPRING_FLYWAY_USER and SPRING_FLYWAY_PASSWORD in the Render dashboard.
      # Leave them unset to reuse the pooled datasource above. The URL must be
      # a direct-endpoint JDBC URL with sslmode=require.

      # Auth secrets: generated once by Render, never stored in this file.
      - key: JWT_SECRET
        generateValue: true
      - key: FORGOT_PASSWORD_SECRET
        generateValue: true
      # Dedicated HMAC key for account login backoff. Generated once; rotating it
      # resets in-flight account backoff state for at most the backoff window.
      # Leaving it blank falls back to FORGOT_PASSWORD_SECRET (transitional).
      - key: ACCOUNT_BACKOFF_HMAC_SECRET
        generateValue: true

      # Client IP trust boundary.
      #
      # DIRECT is the only mode that can be justified without an independently
      # verified list of Render proxy CIDRs: the application ignores all
      # X-Forwarded-For values and rate-limits on the connection peer address.
      # Operationally this means all requests arriving through the Render proxy
      # share one rate-limit bucket. Before switching to TRUSTED_CIDR with an
      # explicit TRUSTED_PROXIES list, verify the proxy behaviour against Render's
      # documented observability data. TRUSTED_HOPS was removed: configuring it
      # fails startup.
      - key: CLIENT_IP_MODE
        value: DIRECT
      - key: TRUSTED_PROXIES
        value: ""

      # Abuse protection (safe defaults; override only deliberately).
      - key: REGISTRATION_IP_LIMIT
        value: "5"
      - key: REGISTRATION_WINDOW_SECONDS
        value: "3600"
      - key: ACCOUNT_BACKOFF_ENABLED
        value: "true"
      - key: ACCOUNT_FAILURE_LIMIT
        value: "5"
      - key: ACCOUNT_WINDOW_SECONDS
        value: "900"
      - key: UPLOAD_QUOTA_ENABLED
        value: "true"
      - key: UPLOAD_QUOTA_USER_PERIOD_BYTES
        value: "52428800"
      - key: UPLOAD_QUOTA_USER_PERIOD_HOURS
        value: "24"

      # Frontend / CORS
      - key: FRONTEND_BASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CORS_ALLOW_CREDENTIALS
        value: "false"

      # Transactional email
      - key: MAIL_PROVIDER
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: ShareLoop

      # Object storage: Render disks are ephemeral, so production must use R2.
      - key: STORAGE_PROVIDER
        value: r2
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false

      # Optional Google login (disabled by default).
      - key: GOOGLE_LOGIN_ENABLED
        value: "false"
      - key: GOOGLE_CLIENT_ID
        sync: false

      # One-time admin bootstrap; enabled manually in Phase 0.7 and then disabled.
      - key: APP_ADMIN_BOOTSTRAP_ENABLED
        value: "false"
      - key: APP_ADMIN_BOOTSTRAP_PRODUCTION_CONFIRMED
        value: "false"
