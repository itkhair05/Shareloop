spring:
  datasource:
    url: ${SPRING_TEST_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shareloop_test_db}
    username: ${SPRING_TEST_DATASOURCE_USERNAME:shareloop_user}
    password: ${SPRING_TEST_DATASOURCE_PASSWORD:shareloop_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Every test class with @DynamicPropertySource gets its own cached Spring
      # context and therefore its own pool. The default 10 connections per pool
      # exhausts PostgreSQL max_connections (100) across the full suite.
      maximum-pool-size: 4
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: shareloop-test-secret-key-for-automated-tests-at-least-32-bytes!
  expiration-ms: 86400000

app:
  seed:
    enabled: false
  admin-bootstrap:
    enabled: false
  storage:
    provider: local
    local:
      # Isolated from the development uploads directory; guarded by TestStorageSupport.
      root-dir: target/test-uploads
      base-url: /api/v1/files
  uploads:
    cleanup:
      # Background sweep is driven explicitly by tests, never by the scheduler.
      cron: "-"
