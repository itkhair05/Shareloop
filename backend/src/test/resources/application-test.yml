spring:
  datasource:
    url: ${SPRING_TEST_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shareloop_test_db}
    username: ${SPRING_TEST_DATASOURCE_USERNAME:shareloop_user}
    password: ${SPRING_TEST_DATASOURCE_PASSWORD:shareloop_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: shareloop-test-secret-key-for-automated-tests-at-least-32-bytes!
  expiration-ms: 86400000

app:
  seed:
    enabled: false
  admin-bootstrap:
    enabled: false
