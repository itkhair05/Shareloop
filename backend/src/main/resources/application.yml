server:
  port: ${PORT:8080}

spring:
  application:
    name: shareloop-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shareloop_db}
    username: ${SPRING_DATASOURCE_USERNAME:shareloop_user}
    password: ${SPRING_DATASOURCE_PASSWORD:shareloop_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
