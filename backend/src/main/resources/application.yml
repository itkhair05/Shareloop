server:
  port: ${PORT:8080}

spring:
  application:
    name: shareloop-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shareloop_db}
    username: ${SPRING_DATASOURCE_USERNAME:shareloop_user}
    password: ${SPRING_DATASOURCE_PASSWORD:shareloop_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 6MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

jwt:
  secret: ${JWT_SECRET:}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  seed:
    enabled: ${APP_SEED_ENABLED:false}
  admin-bootstrap:
    enabled: ${APP_ADMIN_BOOTSTRAP_ENABLED:false}
    email: ${ADMIN_BOOTSTRAP_EMAIL:}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}
    name: ${ADMIN_BOOTSTRAP_NAME:Admin ShareLoop}
    production-confirmed: ${APP_ADMIN_BOOTSTRAP_PRODUCTION_CONFIRMED:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  security:
    rate-limit:
      trusted-proxies: ${TRUSTED_PROXIES:}
      login-limit: ${LOGIN_RATE_LIMIT:5}
      login-window-seconds: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:60}
      login-attempt-retention-hours: ${LOGIN_RATE_LIMIT_RETENTION_HOURS:24}
  storage:
    provider: ${STORAGE_PROVIDER:local}
    local:
      root-dir: ${STORAGE_LOCAL_ROOT:uploads}
      base-url: ${STORAGE_BASE_URL:/api/v1/files}
    r2:
      endpoint: ${R2_ENDPOINT:}
      bucket-name: ${R2_BUCKET_NAME:}
      access-key-id: ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
      public-url-prefix: ${R2_PUBLIC_URL_PREFIX:}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true

